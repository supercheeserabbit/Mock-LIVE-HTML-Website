<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>

  <!-- Supabase JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ── Variables from SCSS palette ── */
    :root {
      --navy:          #1a2340;
      --green:         #5fa936;
      --green-hover:   #4a8a26;
      --charcoal:      #4a5568;
      --slate:         #7a8aaa;
      --white:         #ffffff;
      --bg-base:       #f5f5f7;
      --bg-cool-white: #f7f8fa;
      --border:        #e8eaed;
      --shadow:        rgba(0, 0, 0, 0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-base);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 24px var(--shadow);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }

    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .card-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 0.4rem;
    }

    .card-header p {
      font-size: 0.9rem;
      color: var(--slate);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 0.4rem;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 0.95rem;
      color: var(--charcoal);
      background: var(--bg-cool-white);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(95, 169, 54, 0.15);
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--green);
      color: var(--white);
      border: none;
      border-radius: 7px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 0.5rem;
    }

    .btn:hover { background: var(--green-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      display: none;
      margin-top: 1rem;
      padding: 0.65rem 0.85rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 7px;
      color: #b91c1c;
      font-size: 0.875rem;
      text-align: center;
    }

    .error-msg.visible { display: block; }

  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h1>Log In</h1>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="yourname@institution.edu" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <button class="btn" type="submit" id="submit-btn">Log In</button>

      <div class="error-msg" id="error-msg"></div>
    </form>
  </div>

  <script>
    // ── Supabase config ──────────────────────────────────────────────────────
    // Replace these two values with your project's URL and anon key.
    // Find them at: supabase.com → your project → Settings → API
    const SUPABASE_URL  = 'https://plsrkfhxfzwzvrtciios.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_2spGzG3-1-xfAGai7r_SSQ_h3TkSHXJ';

    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

    // ── Redirect if already logged in ───────────────────────────────────────
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = '/reports.html'; // change to your protected page
    });

    // ── Login form handler ───────────────────────────────────────────────────
    const form      = document.getElementById('login-form');
    const btn       = document.getElementById('submit-btn');
    const errorBox  = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        errorBox.textContent = error.message;
        errorBox.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      } else {
        window.location.href = '/reports.html'; // change to your protected page
      }
    });
  </script>

</body>
</html>
